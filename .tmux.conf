set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on

set -g base-index 1
set -g renumber-windows on

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

set -g history-limit 50000

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v
bind \\ split-window -h

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind , command-prompt -I "#W" {rename-window -- "%%"}
bind w choose-window
bind x kill-pane
bind X kill-window

bind s choose-session
bind S command-prompt -I "#S" {rename-session -- "%%"}
bind D detach -a

bind r source-file ~/.tmux.conf \; display " Config reloaded"

set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind p paste-buffer

bind -r m last-window
bind -r n next-window
bind -r p previous-window
bind = swap-pane -D

bind z resize-pane -Z
bind y setw synchronize-panes

set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80
set -g status-style "bg=#1a1b26 fg=#a9b1d6"
set -g status-left "#[fg=#7dcfff,bold] #S "
set -g status-right "#[fg=#565f89]#(whoami)@#{hostname_short} #[fg=#7dcfff]%Y-%m-%d %H:%M "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7dcfff] #I:#W "
set -g window-status-format "#[fg=#a9b1d6] #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7dcfff"
set -g message-style "bg=#7dcfff fg=#1a1b26"
set -g message-command-style "bg=#7dcfff fg=#1a1b26"
