# --- Hyprland Expert Config (ThinkPad T440) ---
# Modern Syntax for v0.55+ (Strict Engineering Mandate)

# --- Monitors ---
monitor = eDP-1, 1600x900@60, 0x0, 1

# --- Env Vars ---
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt5ct
env = MOZ_ENABLE_WAYLAND, 1
env = GDK_BACKEND, wayland,x11
env = XCURSOR_THEME, Bibata-Modern-Classic
env = HYPRCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

$mainMod = SUPER

# --- Autostart ---
exec-once = ~/.config/hypr/gtk-theme.sh
exec-once = env GTK_THEME=Adwaita swaync
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = awww-daemon
exec-once = systemctl --user start tide-island
exec-once = waybar
exec-once = /home/cedric/.local/bin/fullscreen-monitor
exec-once = hypridle
exec-once = wl-clip-persist --clipboard both
exec-once = clipse -listen
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = ~/.local/bin/battery-notifier
exec-once = hyprsunset

# --- Input ---
input {
    kb_layout = us
    kb_options = caps:swapescape
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        middle_button_emulation = true
        drag_lock = true
    }
    sensitivity = 0
    repeat_rate = 50
    repeat_delay = 300
}

gesture = 3, horizontal, workspace
gesture = 3, up, dispatcher, exec, quickshell --path /home/cedric/.local/share/tide-island ipc call overview toggle

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- General ---
general {
    gaps_in = 4
    gaps_out = 36, 8, 8, 8
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(f5e0dcff) 45deg
    col.inactive_border = rgba(585b70aa)
    layout = dwindle
}

# --- Decoration ---
decoration {
    rounding = 10
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# --- Animations (lightweight for Intel HD 4400) ---
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 2, ease, slide
    animation = border, 1, 3, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, ease, slide
}

# --- Layouts ---
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# --- Misc (No-nonsense settings) ---
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
    font_family = "JetBrainsMono Nerd Font"
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

# --- Debug (Modern VFR home) ---
debug {
    vfr = true
}

# --- Window Rules (Modern match: syntax for v0.55+) ---
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(polkit-kde-authentication-agent-1)$
windowrule = float on, match:class ^(rofi)$
windowrule = float on, match:title ^(rofi)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Select a File)$
windowrule = float on, match:title ^(Choose wallpaper)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Firefox — Share|Save File|Open File|Choose|Library)$
windowrule = float on, match:class ^(org\.mozilla\.firefox)$, match:title ^(Firefox — Share|Save File|Open File|Choose|Library)$
windowrule = float on, match:class ^(.obsidian-wrapper)$
windowrule = size 800 600, match:class ^(.obsidian-wrapper)$
windowrule = center on, match:class ^(.obsidian-wrapper)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Volume Control)$

# --- Keybindings ---

# Essentials
bind = $mainMod, T, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, rofi -show drun
bind = $mainMod, J, layoutmsg, togglesplit

# Tools
bind = $mainMod, O, exec, obsidian
bind = $mainMod, X, exec, /home/cedric/.local/bin/powermenu
bind = $mainMod, H, exec, kitty -e clipse
bind = $mainMod, Z, exec, swaync-client -t -sw
bind = $mainMod, W, exec, /home/cedric/.local/bin/wall-picker
bind = $mainMod SHIFT, W, exec, /home/cedric/.local/bin/networkmanager_dmenu

# Emoji picker
bind = $mainMod, period, exec, rofi -modi emoji -show emoji

# Clipboard history (cliphist + rofi) with auto-paste
bind = $mainMod, Y, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy && wtype -M ctrl v -m ctrl

# Screenshots (Interactive Swappy)
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -

# Movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move Active
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Media / Brightness
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, /home/cedric/.local/bin/brightness-notify up
bindel = , XF86MonBrightnessDown, exec, /home/cedric/.local/bin/brightness-notify down

# Night Light (hyprsunset)
bind = $mainMod, N, exec, /home/cedric/.local/bin/nightlight-toggle
bind = $mainMod CTRL, N, exec, /home/cedric/.local/bin/nightlight-set off

# Phone (KDE Connect)
bind = $mainMod, P, exec, /home/cedric/.local/bin/phone-ping
bind = $mainMod SHIFT, P, exec, /home/cedric/.local/bin/phone-ring
bind = $mainMod, B, exec, /home/cedric/.local/bin/phone-clipboard-sync
bind = $mainMod SHIFT, B, exec, /home/cedric/.local/bin/phone-clipboard-sync to-phone
bind = $mainMod SHIFT, S, exec, /home/cedric/.local/bin/phone-sms
bind = $mainMod SHIFT, F, exec, /home/cedric/.local/bin/phone-send-file

# Productivity
bind = $mainMod SHIFT, N, exec, /home/cedric/.local/bin/quick-note
bind = $mainMod SHIFT, G, exec, /home/cedric/.local/bin/toggle-gamemode
bind = $mainMod SHIFT, L, exec, /home/cedric/.local/bin/toggle-idle-inhibit
bind = $mainMod SHIFT, C, exec, /home/cedric/.local/bin/pick-color

# Tide-Island Overview
bind = $mainMod SHIFT, Space, exec, quickshell --path /home/cedric/.local/share/tide-island ipc call overview toggle
# Escape closes any open island panel (handled by QML Shortcut when island has focus)
bind = $mainMod, Escape, exec, quickshell --path /home/cedric/.local/share/tide-island ipc call overview close

# Misc
bind = $mainMod, L, exec, hyprlock
